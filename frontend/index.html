<!DOCTYPE html>

<html>

<head>
    <title>KK AI Chat</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>


<body>

<div class="container">

        <!-- 顶部 -->
        <div class="header">

            <div class="logo">
                KK
            </div>

            <div class="title">
                <h1>KK Chat</h1>
                <p>Your AI Agent</p>
            </div>
            
            <div class="setting">
                <h1>⚙</h1>
                <p>Settings</p>
            </div>
        </div>

        <!-- 聊天区域 -->
        <div id="answer" class="chat-area">
            

        </div>

        <!-- 输入区域 -->
        <div class="input-area">

            <input
                id="question"
                placeholder="Please talk to me..."
            >

            <button id="sendButton" onclick="chat()">
                ➜
            </button>

        </div>

    </div>


<script>
//封装自动滚动到底部的函数
function scrollToBottom() {
    const chatDiv = document.getElementById("answer");
    chatDiv.scrollTop = chatDiv.scrollHeight;
}
// 定义一个函数
// 当点击"发送"按钮时，就会执行这里面的代码
async function chat(){
    //disable buttom防止连点
    const sendButton = document.getElementById("sendButton");
    sendButton.disabled = true;
    // 获取输入框对象
    const questionInput = document.getElementById("question");
    // 获取输入框里的文字
    const question = questionInput.value;
    //如果输入的内容是空的，就不发送请求,结束函数
    if(question == ""){
        //提示用户输入的内容不能为空
        alert("请输入问题");
        return;
    }

    // 打印一下，方便调试
    console.log(question);

    //打印用户的问题到网页上
    //先找到聊天区域
    const chatDiv = document.getElementById("answer");
    //把盒子里面的内容改成 用户提问,显示到网页上
    const message = document.createElement("div");
    message.className = "message user";
    message.textContent = question;
    chatDiv.appendChild(message);
    scrollToBottom();


        // 清空输入框
    questionInput.value = "";



    //创建一个新的HTML元素来显示loading状态
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "Thinking...";
    chatDiv.appendChild(aiMessage);
    scrollToBottom();

    // 向 FastAPI 发送 POST 请求
    const response = await fetch("/chat/stream", {

        // 请求方式
        method: "POST",

        // 告诉 FastAPI 我发送的是 JSON
        headers: {
            "Content-Type": "application/json"
        },

        // 请求体（JSON）
        body: JSON.stringify({

            // 对应 ChatRequest.question
            question: question

        })

    });

    // 获取响应体的可读流
    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while(true){

        const {done,value} = await reader.read();

        if(done){
            break;
        }
    aiMessage.textContent = aiMessage.textContent.replace("Thinking...","");
    const text = decoder.decode(value);

    aiMessage.textContent += text;

    scrollToBottom();

}

    sendButton.disabled = false;

}
    // 监听输入框的回车事件
    // 获取输入框
    const questionInput = document.getElementById("question");

    // 监听输入框键盘按下事件
    questionInput.addEventListener("keydown", function(event){

        // 打印按下的按键
        console.log(event.key);
        //如果按下了enter键，就执行chat函数
        if(event.key === "Enter"){
            chat();
        }

});

</script>

</body>

</html>
